name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check
      - run: pnpm exec tsc --noEmit
      - run: pnpm test:coverage # unitários + meta de 90% em domain/ e autorizacao (05 §3.11)
      - run: pnpm test:pdf # snapshot de texto dos PDFs (05 §3.11)
      - run: pnpm test:integration # Testcontainers (Docker disponível no runner)
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm build
  e2e:
    # E2E (05 §3.11) com Postgres embutido e `next dev` no próprio runner, provisório até existir o
    # deploy de preview (Vercel): aí o alvo passa a ser o preview, com E2E_BASE_URL.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            test-results/
            playwright-report/
          retention-days: 7
